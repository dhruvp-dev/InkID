<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InkID | Forensic Analyzer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: { gray: tailwind.colors.zinc }
                }
            }
        }
    </script>
    
    <style>
        .reveal { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ai-glow { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
    </style>
</head>

<body class="bg-[#09090b] text-gray-300 min-h-screen selection:bg-indigo-500/30">

    <div class="max-w-6xl mx-auto px-6 py-16 md:py-24">
        
        <header class="mb-12 text-center">
            <h1 class="text-3xl md:text-5xl font-bold text-white tracking-tight mb-4">InkID</h1>
            <p class="text-gray-500 max-w-lg mx-auto text-xs md:text-sm leading-relaxed tracking-widest uppercase opacity-80">
                Linguistic Attribution // HC3 Calibrated Stats
            </p>
        </header>
    
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl p-6 flex flex-col">
                <div class="flex items-center gap-3 mb-6">
                    <div class="p-2 bg-indigo-500/10 rounded-lg shrink-0">
                        <i data-lucide="fingerprint" class="w-5 h-5 text-indigo-400"></i>
                    </div>
                    <div><h2 class="text-sm font-bold text-white uppercase tracking-wider">Known Author Profile</h2></div>
                </div>
                <div id="samples-container" class="space-y-4 flex-1">
                    <div class="sample-wrap relative group flex flex-col h-full">
                        <label class="text-[10px] font-mono tracking-widest text-gray-500 mb-2">SAMPLE 01</label>
                        <textarea name="known_texts" rows="8" class="w-full flex-1 bg-[#09090b] border border-gray-800 rounded-xl p-4 text-sm font-mono text-gray-200 focus:border-indigo-500/50 outline-none transition-all" placeholder="Paste known human writing..."></textarea>
                    </div>
                </div>
                <button onclick="addSample()" class="mt-4 w-full justify-center inline-flex items-center gap-2 text-xs font-mono text-indigo-400 hover:text-indigo-300 transition-colors py-3 px-3 rounded-lg border border-dashed border-indigo-500/30 hover:bg-indigo-500/10">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add sample
                </button>
            </div>
    
            <div class="bg-gray-900/50 border border-gray-800 rounded-2xl p-6 flex flex-col">
                <div class="flex items-center gap-3 mb-6">
                    <div class="p-2 bg-emerald-500/10 rounded-lg shrink-0">
                        <i data-lucide="file-search" class="w-5 h-5 text-emerald-400"></i>
                    </div>
                    <div><h2 class="text-sm font-bold text-white uppercase tracking-wider">Test Document</h2></div>
                </div>
                <div class="flex flex-col flex-1">
                    <label class="text-[10px] font-mono tracking-widest text-gray-500 mb-2">UNKNOWN TEXT</label>
                    <textarea id="test-text" class="w-full flex-1 min-h-[250px] bg-[#09090b] border border-gray-800 rounded-xl p-4 text-sm font-mono text-gray-200 focus:border-emerald-500/50 outline-none transition-all" placeholder="Paste the suspect text here..."></textarea>
                </div>
            </div>
        </div>

        <button id="analyze-btn" onclick="analyze()" class="w-full bg-white text-black hover:bg-gray-200 font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2">
            <i data-lucide="zap" class="w-5 h-5"></i>
            <span id="btn-text">RUN ANALYSIS</span>
            <i data-lucide="loader-2" id="spinner" class="w-5 h-5 animate-spin hidden"></i>
        </button>
    
        <div id="result" class="hidden mt-12 max-w-6xl mx-auto space-y-6 reveal">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-10 shadow-2xl">
                    <div class="flex justify-between items-start mb-10">
                        <div>
                            <label class="text-[10px] font-mono text-gray-500 uppercase">Verdict</label>
                            <h3 id="verdict-text" class="text-3xl font-bold mt-1">—</h3>
                            <p id="explanation-text" class="text-sm text-gray-400 mt-4 max-w-md leading-relaxed"></p>
                        </div>
                        <span id="conf-badge" class="px-3 py-1 rounded-full text-[10px] font-mono font-bold uppercase border">—</span>
                    </div>

                    <div class="mb-8">
                        <div class="flex justify-between mb-3">
                            <span class="text-xs font-mono text-gray-500 uppercase">Match Score</span>
                            <span id="score-pct" class="text-2xl font-bold font-mono">—</span>
                        </div>
                        <div class="h-2 w-full bg-gray-950 rounded-full overflow-hidden border border-gray-800/50">
                            <div id="bar-fill" class="h-full w-0 transition-all duration-1000 ease-out rounded-full"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-[#09090b] border border-gray-800 rounded-xl p-4">
                            <p class="text-[10px] font-mono text-gray-500 uppercase mb-1">Char TF-IDF</p>
                            <p id="char-score" class="text-lg font-mono text-white font-semibold">—</p>
                        </div>
                        <div class="bg-[#09090b] border border-gray-800 rounded-xl p-4">
                            <p class="text-[10px] font-mono text-gray-500 uppercase mb-1">Word TF-IDF</p>
                            <p id="word-score" class="text-lg font-mono text-white font-semibold">—</p>
                        </div>
                        <div class="bg-[#09090b] border border-gray-800 rounded-xl p-4">
                            <p class="text-[10px] font-mono text-gray-500 uppercase mb-1">Samples</p>
                            <p id="sample-count" class="text-lg font-mono text-white font-semibold">—</p>
                        </div>
                        <div class="bg-[#09090b] border border-gray-800 rounded-xl p-4">
                            <p class="text-[10px] font-mono text-indigo-400 uppercase mb-1">Blended</p>
                            <p id="blended-val" class="text-lg font-mono text-indigo-400 font-bold">—</p>
                        </div>
                    </div>
                </div>

                <div id="ai-card" class="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl flex flex-col ai-glow">
                    <div class="flex items-center gap-2 mb-6">
                        <i data-lucide="bot" class="w-5 h-5 text-indigo-400"></i>
                        <h4 class="text-xs font-bold text-white uppercase tracking-wider">AI Content Analysis</h4>
                    </div>
                    <div class="text-center py-6 flex-1">
                        <div class="relative inline-flex items-center justify-center">
                            <svg class="w-32 h-32 transform -rotate-90">
                                <circle cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent" class="text-gray-800" />
                                <circle id="ai-circle" cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent" 
                                        stroke-dasharray="364.4" stroke-dashoffset="364.4"
                                        class="text-indigo-500 transition-all duration-1000 ease-out" />
                            </svg>
                            <span id="ai-pct" class="absolute text-2xl font-bold font-mono text-white">0%</span>
                        </div>
                        <p id="ai-verdict-label" class="mt-4 text-xs font-mono uppercase tracking-widest text-gray-500">—</p>
                        <p id="ai-conf-text" class="text-[9px] font-mono text-gray-600 mt-1 uppercase">—</p>
                    </div>
                    <div class="space-y-2 mt-4 pt-4 border-t border-gray-800">
                        <div class="flex justify-between text-[10px] font-mono"><span class="text-gray-500 uppercase">Entropy</span><span id="sig-entropy" class="text-indigo-400">—</span></div>
                        <div class="flex justify-between text-[10px] font-mono"><span class="text-gray-500 uppercase">Variance</span><span id="sig-variance" class="text-indigo-400">—</span></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
                <h4 class="text-sm font-bold text-white uppercase tracking-wider mb-6">Feature Breakdown</h4>
                <div id="features-grid" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>
            </div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
        function addSample() {
            const container = document.getElementById('samples-container');
            const div = document.createElement('div');
            div.className = 'sample-wrap relative group mt-4 reveal flex flex-col h-full';
            div.innerHTML = `<div class="flex justify-between items-center mb-2"><label class="text-[10px] font-mono tracking-widest text-gray-500 uppercase">ADDITIONAL SAMPLE</label><button onclick="this.closest('.sample-wrap').remove()" class="p-1 hover:bg-red-500/10 text-red-400 rounded"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div><textarea name="known_texts" rows="4" class="w-full flex-1 bg-[#09090b] border border-gray-800 rounded-xl p-4 text-sm font-mono text-gray-200 focus:border-indigo-500/50 outline-none transition-all"></textarea>`;
            container.appendChild(div);
            lucide.createIcons();
        }

        async function analyze() {
            const btn = document.getElementById('analyze-btn');
            const spinner = document.getElementById('spinner');
            const knownTexts = [...document.querySelectorAll('[name="known_texts"]')].map(t => t.value.trim()).filter(Boolean);
            const testText = document.getElementById('test-text').value.trim();

            if (!knownTexts.length || !testText) return alert("Missing samples or test text.");
            btn.disabled = true; spinner.classList.remove('hidden');

            try {
                const formData = new FormData();
                knownTexts.forEach(t => formData.append('known_texts', t));
                formData.append('test_text', testText);
                
                const res = await fetch('/analyze', { method: 'POST', body: formData });
                if (!res.ok) throw new Error("Server Error");
                renderResult(await res.json());
            } catch (e) {
                console.error(e);
                alert("Error during analysis. Check terminal.");
            } finally {
                btn.disabled = false; spinner.classList.add('hidden');
            }
        }

       function renderResult(d) {
    console.log("Rendering Result:", d);
    const resultDiv = document.getElementById('result');
    if (!resultDiv) return;
    resultDiv.classList.remove('hidden');
    
    // Themes
    const themes = { green: 'text-emerald-400', yellow: 'text-amber-400', orange: 'text-orange-400', red: 'text-rose-400' };
    const themeClass = themes[d.color] || themes.red;

    // Authorship - Use hyphens to match HTML IDs
    document.getElementById('verdict-text').textContent = d.label || "N/A";
    document.getElementById('verdict-text').className = `text-3xl font-bold mt-1 tracking-tight ${themeClass}`;
    document.getElementById('explanation-text').textContent = d.explanation || "";
    document.getElementById('conf-badge').textContent = (d.confidence || "LOW") + ' CONFIDENCE';
    
    const pct = Math.round((d.similarity|| 0) * 100);
    document.getElementById('score-pct').textContent = pct + '%';
    document.getElementById('bar-fill').style.width = pct + '%';
    document.getElementById('bar-fill').className = `h-full transition-all duration-1000 ${pct > 50 ? 'bg-emerald-500' : 'bg-rose-500'}`;

    // Detail Stats - Ensure these IDs exist in your HTML
    if (document.getElementById('char-score')) 
        document.getElementById('char-score').textContent = (d.char_score * 100).toFixed(1) + '%';
    if (document.getElementById('word-score')) 
        document.getElementById('word-score').textContent = (d.word_score * 100).toFixed(1) + '%';
    if (document.getElementById('sample-count')) 
        document.getElementById('sample-count').textContent = d.sample_count || 0;
    if (document.getElementById('blended-val')) 
        document.getElementById('blended-val').textContent = pct + '%';

    // AI Section
    const aiVal = Math.round((d.ai_probability || 0) * 100);
    document.getElementById('ai-pct').textContent = aiVal + '%';
    document.getElementById('ai-circle').style.strokeDashoffset = 364.4 - (aiVal / 100) * 364.4;
    document.getElementById('ai-verdict-label').textContent = d.ai_label || "No Result";
    document.getElementById('ai-conf-text').textContent = d.ai_confidence || "";
    
    if (d.ai_signals) {
        document.getElementById('sig-entropy').textContent = d.ai_signals.word_entropy || 'N/A';
        document.getElementById('sig-variance').textContent = d.ai_signals.sentence_variance || 'N/A';
    }

    // Grid Comparison
    const grid = document.getElementById('features-grid');
    grid.innerHTML = '';
    const labels = { word_count: 'Words', avg_sentence_length: 'S-Len', avg_word_length: 'W-Len', lexical_diversity: 'Richness', punct_density: 'Punct' };
    
    Object.entries(labels).forEach(([key, label]) => {
        const kv = d.known_features ? d.known_features[key] : 0;
        const tv = d.test_features ? d.test_features[key] : 0;
        const item = document.createElement('div');
        item.className = 'bg-[#09090b] border border-gray-800 rounded-xl p-3';
        item.innerHTML = `
            <div class="text-[9px] font-mono text-gray-500 uppercase mb-2">${label}</div>
            <div class="flex items-end justify-between">
                <span class="text-xs font-mono text-indigo-400">${kv}</span>
                <span class="text-xs font-mono text-emerald-400">${tv}</span>
            </div>`;
        grid.appendChild(item);
    });

    resultDiv.scrollIntoView({ behavior: 'smooth' });
}
    </script>
</body>
</html>
